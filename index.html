<script>

const M=[
"yow, hai Tania.",

"Intania Fakhira Nazwa..\n(bener ga sih? wkwk)",
"愛してる。"];

const dc=$('dust'),dg=dc.getContext('2d');let W=0,H=0,D=[];

addEventListener('resize',fit);fit();
(function f(){dg.clearRect(0,0,W,H);for(const d of D){d.p+=.01;d.x+=d.vx+Math.sin(d.p)*.1;d.y+=d.vy;if(d.y<-5){d.y=H+5;d.x=Math.random()*W}
dg.globalAlpha=d.a*(.6+.4*Math.sin(d.p*2));dg.fillStyle='#c9d6e2';dg.beginPath();dg.arc(d.x,d.y,d.r,0,6.28);dg.fill()}requestAnimationFrame(f)})();
